# fly.toml — Fenrix submission app (FastAPI/uvicorn)
# Deploy with: fly launch --copy-config --no-deploy   (first time)   then: fly deploy
# Docs: https://fly.io/docs/reference/configuration/

# NOTE: set this after `fly launch` picks/validates a globally unique name,
# or pass --name on launch. Placeholder below:
app = "fenrix-submission"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Persist DB + artifacts under /data (mount a Fly Volume there, see DEPLOY_FLY.md).
  ARENA_DB_PATH = "/data/arena.sqlite3"
  MARKET_FUZZER_ARTIFACT_ROOT = "/data/artifacts/market_fuzzer"
  MARKET_FUZZER_EXPERIMENT_ROOT = "/data/artifacts"

[processes]
  app = "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle (saves free-trial VM hours)
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.checks]
    [http_service.checks.ready]
      grace_period = "15s"
      interval = "10s"
      timeout = "3s"
      method = "GET"
      path = "/api/ready"

# Uncomment after creating a volume (fly volumes create fenrix_data --size 1)
# to persist the sqlite DB and generated artifacts across deploys/restarts:
# [mounts]
#   source = "fenrix_data"
#   destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # pandas + pyarrow + numpy need headroom; 256mb WILL OOM on import
