# Render deploy config for the Fenrix Submission web app.
# Target: a free Web Service (GitHub-connected). Fly.io's free tier is now a
# time-limited trial (card required, auto-stop) — Render free web service is the
# better fit for a student/GitHub-connected deploy.
#
# Render reads this file on "New > Web Service > connect repo". If you prefer the
# dashboard, the equivalent settings are: Runtime=Python 3, Build Command=
# "pip install -r requirements-render.txt", Start Command=
# "uvicorn app.main:app --host 0.0.0.0 --port $PORT".

services:
  - type: web
    name: fenrix-submission
    runtime: python
    plan: free
    region: oregon        # pick the region nearest you
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/ready"
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Evidence packages are written under artifacts/ at runtime. On Render's
      # ephemeral filesystem they vanish on redeploy — fine for live runs; the
      # committed deck (app/static/pitch-deck/) is served statically regardless.
      # For persistent evidence, add a Render Disk and set MARKET_FUZZER_ARTIFACT_ROOT.
      - key: MARKET_FUZZER_ARTIFACT_ROOT
        value: "/data/artifacts/market_fuzzer"
      - key: ARENA_DB_PATH
        value: "/data/arena.sqlite3"
