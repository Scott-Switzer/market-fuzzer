name: fwf-nightly

# Financial World Factory M5 nightly gate.
#
# Runs the three M5 gates on a schedule, at the budgets that would be too slow
# for a pull-request pipeline:
#
#   M5.1  scripts/m5_oracle.py    100 deterministic sequences against the
#                                 python-accounting oracle, every trial-balance
#                                 delta exactly 0.00, plus the planted-defect
#                                 sensitivity checks.
#   M5.2  scripts/m5_stateful.py  the canonical Hypothesis state machines at
#                                 max_examples=1000, machines and invariants
#                                 unchanged from the committed suite.
#   M5.3  scripts/m5_mutation.py  mutmut over the four accounting kernel
#                                 modules; zero untriaged survivors and zero
#                                 REAL_TEST_GAP verdicts required.
#
# Every gate re-verifies the vendored kernel's pinned hashes before it runs, so
# a drifted snapshot fails here rather than producing a meaningless green.
#
# M5.1 needs python-accounting, whose declared mysqlclient/psycopg2 drivers are
# intentionally absent (the oracle is SQLite-only); requirements-m5.txt pins
# that install with --no-deps. M5.3 needs mutmut, which is not a runtime or dev
# dependency of the app.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fwf-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  oracle:
    name: M5.1 differential oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install the app and the oracle (no DB drivers)
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -r requirements-m5.txt
      - name: Verify vendored kernel hashes
        run: python scripts/m5_vendor.py
      - name: Run the 100-sequence differential oracle
        run: python scripts/m5_oracle.py --count 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-oracle-report
          path: artifacts/m5/oracle_report.json

  stateful:
    name: M5.2 nightly stateful (1000 examples)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - name: Verify vendored kernel + suite hashes
        run: python scripts/m5_vendor.py
      # --skip-fast: the PR pipeline already runs the fast budget on every push.
      - name: Run the 1000-example stateful budget
        run: python scripts/m5_stateful.py --skip-fast --timeout 5400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-stateful-report
          path: artifacts/m5/stateful_report.json

  mutation:
    name: M5.3 mutation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install mutmut==3.8.0
      - name: Verify vendored kernel hashes
        run: python scripts/m5_vendor.py
      - name: Run mutmut over the four accounting modules
        run: python scripts/m5_mutation.py --targets primary --children 8 --timeout 7200
      - name: Classify every survivor; fail on any test gap
        run: python scripts/m5_triage.py --require-clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-mutation-report
          path: |
            artifacts/m5/mutation_survivors.json
            tests/m5/mutation_triage.json

  summary:
    name: Nightly summary
    needs: [oracle, stateful, mutation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-*
          path: artifacts
          merge-multiple: true
      - name: Recombine the artifacts into the repo layout
        run: |
          mkdir -p artifacts/m5
          cp artifacts/oracle-report/oracle_report.json artifacts/m5/ 2>/dev/null || true
          cp artifacts/stateful-report/stateful_report.json artifacts/m5/ 2>/dev/null || true
          cp artifacts/mutation-report/mutation_survivors.json artifacts/m5/ 2>/dev/null || true
          cp artifacts/mutation-report/mutation_triage.json tests/m5/ 2>/dev/null || true
      - name: Aggregate and judge
        run: |
          pip install -e '.[dev]' --quiet
          python -c "import app" 2>/dev/null || true
          python scripts/m5_summary.py
