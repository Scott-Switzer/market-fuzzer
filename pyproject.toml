[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-market-world"
version = "1.0.0rc1"
description = "Counterfactual synthetic exchange and strategy stress-testing laboratory"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=2,<3",
  "openai>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "yfinance>=0.2,<2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "playwright>=1.50,<2",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
# Lock-generation tooling only. NOT part of the compiled runtime/test graph
# (pip-tools drags in unpinned build backends that break --require-hashes).
# Install standalone: `pip install "pip-tools>=7.4,<8"` then `make lock`.
lock = [
  "pip-tools>=7.4,<8",
]

[project.scripts]
smw = "app.cli:entrypoint"
fwf = "app.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# M5.3 mutation hardening.
#
# Mutation testing must exercise the *actual kernel byte content Market Fuzzer
# ships*, so `source_paths` points at the vendored snapshot rather than at a
# paraphrase. The killing suite is the vendored canonical Financial System Core
# kernel test surface (see tests/m5/kernel_stateful/SOURCE.json), which is the
# same bytes the canonical repository runs -- not a Market Fuzzer re-write.
#
# `only_mutate` restricts the run to the accounting-relevant accounting targets.
# The differential oracle is deliberately NOT the killing suite: a hundred
# sequences take far longer per candidate than a mutant budget can afford, and
# the oracle's job is to prove cross-implementation agreement, not to pin every
# branch.
[tool.mutmut]
source_paths = ["app/_vendor/fwf_kernel"]
only_mutate = [
  "app/_vendor/fwf_kernel/ledger.py",
  "app/_vendor/fwf_kernel/subledgers.py",
  "app/_vendor/fwf_kernel/equity.py",
  "app/_vendor/fwf_kernel/filings.py",
  "app/_vendor/fwf_kernel/temporal.py",
]
pytest_add_cli_args_test_selection = ["tests/m5/kernel_stateful"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-x", "--no-header", "-q"]
timeout_multiplier = 6.0
timeout_constant = 30.0
use_git_change_detection = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/_vendor/fwf_kernel", "tests/m5/kernel_stateful"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
follow_imports = "silent"
exclude = [
    "^app/break_test/",
    "^app/api/app\\.py$",
    "^app/persistence/migrations/",
    "^docs/",
]
